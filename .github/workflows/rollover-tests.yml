name: Date rollover regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      - name: Install Home Assistant and the pinned calendar library
        run: |
          python -m pip install "homeassistant==2026.11.1" "async-timeout==5.0.1"
          python -c 'import json, subprocess, sys; reqs = json.load(open("custom_components/nyc311/manifest.json"))["requirements"]; subprocess.check_call([sys.executable, "-m", "pip", "install", *reqs])'
      - name: Test calendar and existing entity rollover
        run: python -m unittest discover -s tests -v
